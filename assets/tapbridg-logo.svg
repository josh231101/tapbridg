<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">TapBridg logo</title>
  <desc id="desc">TapBridg bridge icon on the left with the TapBridg wordmark on the right.</desc>

  <!-- Transparent background -->

  <!-- Bridge icon -->
  <g transform="translate(70 72)">
    <!-- Left / lower bridge -->
    <path
      d="M40 260
         C40 176 108 108 192 108
         C231 108 267 123 294 148
         C248 144 206 160 174 189
         C146 215 130 249 130 286
         H40Z"
      fill="#4B5563"/>

    <!-- Right / upper bridge -->
