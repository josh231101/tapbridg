      d="M120 94
         C158 62 207 44 259 44
         C374 44 468 138 468 253
         V286
         H376
         V253
         C376 188 323 135 258 135
         C218 135 181 155 159 188
         C151 169 138 152 120 139
         C106 128 92 121 77 117
         C89 108 103 101 120 94Z"
      fill="#0F1B2D"/>
  </g>

  <!-- Wordmark -->
  <text
    x="560"
    y="278"
    fill="#0F1B2D"
    font-family="Inter, Sora, Avenir Next, Helvetica Neue, Arial, sans-serif"
    font-size="210"
    font-weight="700"
    letter-spacing="-10">
